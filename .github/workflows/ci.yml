name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-lint:
    name: Python Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'
          cache: pip

      - name: Install pdm
        run: python -m pip install pdm

      - name: Install lint dependencies
        run: pdm install -G lint

      - name: Run flake8
        run: pdm run lint

  python-format:
    name: Python Format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'
          cache: pip

      - name: Install pdm
        run: python -m pip install pdm

      - name: Install lint dependencies
        run: pdm install -G lint

      - name: Run format
        run: pdm run format-check

  node-lint:
    name: Node Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

  node-test:
    name: Node Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: npm
      
      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

  build:
    name: Build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        tethys-version: ["4.5.1"]
        python-version: ["3.10"]
        django-version: ["4.2"]
    outputs:
      tag: ${{ steps.set-tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: 'recursive'

      - name: Set Env
        run: echo "IMAGE=aquaveollc/tethysapp-tribs" >> $GITHUB_ENV

      - id: set-tag
        name: Set Tag
        run: |
          TAG="dev${GITHUB_SHA::8}-ty${{ matrix.tethys-version }}-py${{ matrix.python-version }}-dj${{ matrix.django-version }}"
          if [[ "${GITHUB_REF}" == */stable ]]; then
            TAG="stable"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "TAG=$TAG" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_BUILDER_USERNAME }}
          password: ${{ secrets.DOCKER_BUILDER_TOKEN }}

      - name: Build and Push Dev
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ env.IMAGE }}:${{ env.TAG }}
          # GitHub Actions cache — survives across runs, no separate DockerHub
          # cache registry needed. Removes the memory pressure that was killing
          # the kaniko cache-push step.
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            TETHYS_VERSION=${{ matrix.tethys-version }}
            PYTHON_VERSION=${{ matrix.python-version }}
            DJANGO_VERSION=${{ matrix.django-version }}
  
  startup-test:
    needs: [build]
    name: Startup Test (ty${{ matrix.tethys-version }}, dj${{ matrix.django-version }}, py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        tethys-version: ["4.5.1"]
        python-version: ["3.10"]
        django-version: ["4.2"]
    env:
      TAG: ${{ needs.build.outputs.tag }}
      IMAGE: aquaveollc/tethysapp-tribs
      # Postgres DB (server-side)
      POSTGRES_DB: tethys_postgis
      POSTGRES_PASSWORD: please_dont_use_default_passwords
      POSTGRES_PORT: "5432"

      # Tethys (client-side)
      TETHYS_PUBLIC_HOST: 172.17.0.1
      TETHYS_DB_HOST: postgis
      TETHYS_DB_PORT: "5432"
      TETHYS_DB_USERNAME: tethys_super
      TETHYS_DB_PASSWORD: please_dont_use_default_passwords
      TETHYS_DB_SUPERUSER: tethys_super
      TETHYS_DB_SUPERUSER_PASS: please_dont_use_default_passwords

      # App DB
      APP_DB_HOST: postgis
      APP_DB_USERNAME: tethys_super
      APP_DB_PASSWORD: please_dont_use_default_passwords

    services:
      postgis:
        image: postgis/postgis:12-2.5
        env:
          POSTGRES_PASSWORD: please_dont_use_default_passwords
          POSTGRES_DB: tethys_postgis
          POSTGRES_HOST_AUTH_METHOD: trust
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432:5432
    steps:
      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_BUILDER_USERNAME }}
          password: ${{ secrets.DOCKER_BUILDER_TOKEN }}

      - name: Pull Docker Image
        run: docker pull "$IMAGE:$TAG"

      - name: Run Salt Test
        run: |
          docker run --rm \
            --name tethysapp-tribs \
            --network "${{ job.services.postgis.network }}" \
            -e POSTGRES_DB \
            -e POSTGRES_PASSWORD \
            -e POSTGRES_PORT \
            -e TETHYS_PUBLIC_HOST \
            -e TETHYS_DB_HOST \
            -e TETHYS_DB_PORT \
            -e TETHYS_DB_USERNAME \
            -e TETHYS_DB_PASSWORD \
            -e TETHYS_DB_SUPERUSER \
            -e TETHYS_DB_SUPERUSER_PASS \
            -e APP_DB_HOST \
            -e APP_DB_USERNAME \
            -e APP_DB_PASSWORD \
            "$IMAGE:$TAG" \
            /bin/bash -c "cd /usr/lib/tethys && source ./run.sh --test"
