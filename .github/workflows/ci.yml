name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-lint:
    name: Python Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'
          cache: pip

      - name: Install pdm
        run: python -m pip install pdm

      - name: Install lint dependencies
        run: pdm install -G lint

      - name: Run flake8
        run: pdm run lint

  python-format:
    name: Python Format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'
          cache: pip

      - name: Install pdm
        run: python -m pip install pdm

      - name: Install lint dependencies
        run: pdm install -G lint

      - name: Run format
        run: pdm run format-check

  node-lint:
    name: Node Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

  node-test:
    name: Node Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: npm
      
      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

  tethys-test:
    name: Tethys Test
    runs-on: ubuntu-latest
    container:
      image: aquaveollc/tethysext-atcore:1.15.1-ty4.4.3-py3.10-dj4.2
    defaults:
      run:
        # Plain bash, NOT login shell. The atcore image's /etc/profile resets
        # PATH (wiping the conda env), so we avoid sourcing it. The image's
        # container-level PATH already includes /opt/conda/envs/tethys/bin,
        # and our env.PATH below pins it explicitly.
        shell: bash -e {0}
    services:
      postgis:
        image: postgis/postgis:12-2.5
        env:
          POSTGRES_DB: tethys_postgis
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: please_dont_use_default_passwords
          POSTGRES_HOST_AUTH_METHOD: trust
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      # Put the conda 'tethys' env's bin first on PATH at the OS level so every
      # subprocess (including /bin/sh spawned by Salt inside run.sh --test) can
      # find tethys/python/pdm. Login-shell activation alone doesn't propagate
      # to sub-subprocesses.
      PATH: /opt/conda/envs/tethys/bin:/opt/conda/condabin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
      # Point pdm at the conda 'tethys' env as if it were the project's venv.
      # This makes `pdm install` install test deps + the editable project INTO
      # the conda env, alongside the pre-installed Tethys/ATCore — instead of
      # creating an empty .venv/ that wouldn't have Tethys.
      VIRTUAL_ENV: /opt/conda/envs/tethys
      # App-level
      BASENAME: tribs
      FILE_UPLOAD_MAX_MEMORY_SIZE: "1073741824"
      DATA_UPLOAD_MAX_MEMORY_SIZE: "1073741824"
      TRIBSAPP_TEST_DATABASE: postgresql://postgres:please_dont_use_default_passwords@postgis:5432/tethys_postgis
      # Tethys DB overrides
      TETHYS_PUBLIC_HOST: 172.17.0.1
      TETHYS_DB_HOST: postgis
      TETHYS_DB_USERNAME: tethys_super
      TETHYS_DB_PASSWORD: please_dont_use_default_passwords
      TETHYS_DB_SUPERUSER_PASS: please_dont_use_default_passwords
      # App DB
      APP_DB_HOST: postgis
      APP_DB_PORT: "5432"
      APP_DB_USERNAME: tethys_super
      APP_DB_PASSWORD: please_dont_use_default_passwords
    
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: 'recursive'

      - name: Mark workspace as safe for git
        # setuptools-scm reads git history to compute the package version.
        # Inside container jobs, the workspace is owned by a different user
        # than the one running git, so git refuses with "dubious ownership".
        # This whitelists the workspace so setuptools-scm can read it.
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Create tests/.env (required by pdm test script)
        run: |
          cat > tests/.env <<EOF
          BASENAME=${BASENAME}
          FILE_UPLOAD_MAX_MEMORY_SIZE=${FILE_UPLOAD_MAX_MEMORY_SIZE}
          DATA_UPLOAD_MAX_MEMORY_SIZE=${DATA_UPLOAD_MAX_MEMORY_SIZE}
          TRIBSAPP_TEST_DATABASE=${TRIBSAPP_TEST_DATABASE}
          EOF

      - name: Initialize Tethys in test mode
        run: bash "${TETHYS_HOME}/run.sh" --test

      - name: Debug environment
        run: |
          echo "==== PATH ===="
          echo "$PATH"
          echo "==== which python ===="
          which python || echo "NOT FOUND"
          which python3 || echo "NOT FOUND"
          echo "==== ls conda env ===="
          ls /opt/conda/envs/tethys/bin/python* || true
          echo "==== shell info ===="
          echo "shell: $0"
          echo "shell flags: $-"

      - run: python -m pip install pdm

      - name: Install conda-only deps (gdal Python bindings)
        # The atcore base image has libgdal but not the `gdal` (osgeo) Python
        # bindings. tribs-adapter imports osgeo at module load, so test
        # collection fails without it. Install via conda since pip-gdal is
        # notoriously fragile.
        # $CONDA_PREFIX is already /opt/conda/envs/tethys so no need to specify
        # -n tethys.
        run: conda install -y -c conda-forge gdal

      - name: Install tribs-adapter (submodule dependency)
        # Mirrors the Dockerfile: tribs-adapter is bundled as a git submodule
        # and installed into the env before tethysapp-tribs. Tests import from
        # tribs_adapter, so it must be on the Python path.
        working-directory: tribs-adapter
        run: pdm install --no-editable --production

      - run: pdm install -G:test
      - run: pdm run test -vv
