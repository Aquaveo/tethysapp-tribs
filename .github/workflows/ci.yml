name: CI

on:
  pull_request:
  push:
    branches: main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-lint:
    name: Python Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'
          cache: pip

      - name: Install pdm
        run: python -m pip install pdm

      - name: Install lint dependencies
        run: pdm install -G lint

      - name: Run flake8
        run: pdm run lint

  python-format:
    name: Python Format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'
          cache: pip

      - name: Install pdm
        run: python -m pip install pdm

      - name: Install lint dependencies
        run: pdm install -G lint

      - name: Run format
        run: pdm run format
