name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-lint:
    name: Python Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'
          cache: pip

      - name: Install pdm
        run: python -m pip install pdm

      - name: Install lint dependencies
        run: pdm install -G lint

      - name: Run flake8
        run: pdm run lint

  python-format:
    name: Python Format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'
          cache: pip

      - name: Install pdm
        run: python -m pip install pdm

      - name: Install lint dependencies
        run: pdm install -G lint

      - name: Run format
        run: pdm run format-check

  node-lint:
    name: Node Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

  node-test:
    name: Node Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: npm
      
      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

  build:
    name: Build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu-latest]
        tethys-version: ["4.5.1"]
        python-version: ["3.10"]
        django-version: ["4.2"]
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: 'recursive'

      - name: Set Env
        run: echo "IMAGE=aquaveollc/tethysapp-tribs" >> $GITHUB_ENV

      - name: Set Tag
        run: echo "TAG=dev${GITHUB_SHA::8}-ty${{ matrix.tethys-version }}-py${{ matrix.python-version }}-dj${{ matrix.django-version }}" >> $GITHUB_ENV

      # If the branch is stable, overwrite the TAG.
      - name: Set Stable Tag
        if: endsWith(github.ref, '/stable')
        run: echo "TAG=stable" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_BUILDER_USERNAME }}
          password: ${{ secrets.DOCKER_BUILDER_TOKEN }}

      - name: Build and Push Dev
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ env.IMAGE }}:${{ env.TAG }}
          # GitHub Actions cache — survives across runs, no separate DockerHub
          # cache registry needed. Removes the memory pressure that was killing
          # the kaniko cache-push step.
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            TETHYS_VERSION=${{ matrix.tethys-version }}
            PYTHON_VERSION=${{ matrix.python-version }}
            DJANGO_VERSION=${{ matrix.django-version }}

